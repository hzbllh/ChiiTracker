<!DOCTYPE html>
<html lang="ms" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    #txList::-webkit-scrollbar { width: 6px; }
    #txList::-webkit-scrollbar-track { background: transparent; }
    #txList::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .dark #txList::-webkit-scrollbar-thumb { background: #475569; }
    #balance, #totalIncome, #totalExpense { transition: color 0.3s ease; }
    .tx-item { transition: background-color 0.15s ease, transform 0.1s ease; }
    .tx-item:hover { transform: translateX(2px); }
    canvas { max-width: 100%; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">💰</span>
        <h1 class="text-xl font-bold">Money Tracker</h1>
      </div>
      <div class="flex items-center gap-3">
        <select id="monthFilter" class="text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary-500">
        </select>
        <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" title="Tukar tema">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- Summary Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
        <p class="text-sm text-gray-500 dark:text-gray-400">Baki</p>
        <p id="balance" class="text-2xl font-bold text-primary-600 dark:text-primary-500 mt-1">RM 0.00</p>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
        <p class="text-sm text-gray-500 dark:text-gray-400">Pendapatan</p>
        <p id="totalIncome" class="text-2xl font-bold text-green-600 dark:text-green-400 mt-1">RM 0.00</p>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
        <p class="text-sm text-gray-500 dark:text-gray-400">Perbelanjaan</p>
        <p id="totalExpense" class="text-2xl font-bold text-red-500 dark:text-red-400 mt-1">RM 0.00</p>
      </div>
    </section>

    <!-- Add Transaction Form -->
    <section class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
      <h2 class="font-semibold text-lg mb-4">Tambah Transaksi</h2>
      <form id="txForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
        <div>
          <label class="text-xs text-gray-500 dark:text-gray-400">Jenis</label>
          <select id="type" class="w-full mt-1 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
            <option value="expense">Perbelanjaan</option>
            <option value="income">Pendapatan</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-gray-500 dark:text-gray-400">Jumlah (RM)</label>
          <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0.00"
            class="w-full mt-1 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500" />
        </div>
        <div>
          <label class="text-xs text-gray-500 dark:text-gray-400">Kategori</label>
          <select id="category" class="w-full mt-1 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
          </select>
        </div>
        <div>
          <label class="text-xs text-gray-500 dark:text-gray-400">Tarikh</label>
          <input type="date" id="date" required
            class="w-full mt-1 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500" />
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg px-4 py-2.5 transition">
            Tambah
          </button>
        </div>
        <div class="sm:col-span-2 lg:col-span-5">
          <label class="text-xs text-gray-500 dark:text-gray-400">Nota (optional)</label>
          <input type="text" id="note" placeholder="Contoh: Makan tengah hari"
            class="w-full mt-1 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500" />
        </div>
      </form>
    </section>

    <!-- Charts -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
        <h2 class="font-semibold text-lg mb-4">Perbelanjaan ikut Kategori</h2>
        <div class="relative h-64">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
        <h2 class="font-semibold text-lg mb-4">Trend Bulanan</h2>
        <div class="relative h-64">
          <canvas id="barChart"></canvas>
        </div>
      </div>
    </section>

    <!-- Transaction List -->
    <section class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-lg">Senarai Transaksi</h2>
        <button id="clearAll" class="text-sm text-red-500 hover:text-red-600 font-medium">Padam Semua</button>
      </div>
      <div id="txList" class="space-y-2 max-h-96 overflow-y-auto"></div>
      <p id="emptyState" class="text-center text-gray-400 py-8 hidden">Belum ada transaksi. Tambah yang pertama!</p>
    </section>

  </main>

  <footer class="text-center text-sm text-gray-400 py-6">
    Money Tracker • Data disimpan di browser anda (localStorage)
  </footer>

<script>
// ======================
// Money Tracker App (Single File)
// ======================

const STORAGE_KEY = 'moneyTracker_transactions';
const THEME_KEY = 'moneyTracker_theme';

const CATEGORIES = {
  expense: [
    { id: 'makan', name: 'Makanan', color: '#f97316' },
    { id: 'transport', name: 'Pengangkutan', color: '#3b82f6' },
    { id: 'belanja', name: 'Belanja', color: '#ec4899' },
    { id: 'bil', name: 'Bil & Utiliti', color: '#8b5cf6' },
    { id: 'hiburan', name: 'Hiburan', color: '#14b8a6' },
    { id: 'kesihatan', name: 'Kesihatan', color: '#ef4444' },
    { id: 'lain', name: 'Lain-lain', color: '#6b7280' }
  ],
  income: [
    { id: 'gaji', name: 'Gaji', color: '#22c55e' },
    { id: 'freelance', name: 'Freelance', color: '#84cc16' },
    { id: 'hadiah', name: 'Hadiah / Bonus', color: '#eab308' },
    { id: 'lain-income', name: 'Lain-lain', color: '#10b981' }
  ]
};

let transactions = [];
let pieChart = null;
let barChart = null;

document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  loadTransactions();
  setupForm();
  setupThemeToggle();
  setupMonthFilter();
  setupClearAll();
  setDefaultDate();
  updateCategoryOptions();
  render();
});

// ---------- Theme ----------
function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'light';
  applyTheme(saved);
}

function applyTheme(theme) {
  const html = document.documentElement;
  if (theme === 'dark') {
    html.classList.add('dark');
    document.getElementById('themeIcon').textContent = '☀️';
  } else {
    html.classList.remove('dark');
    document.getElementById('themeIcon').textContent = '🌙';
  }
  localStorage.setItem(THEME_KEY, theme);
  if (pieChart || barChart) updateCharts();
}

function setupThemeToggle() {
  document.getElementById('themeToggle').addEventListener('click', () => {
    const isDark = document.documentElement.classList.contains('dark');
    applyTheme(isDark ? 'light' : 'dark');
  });
}

// ---------- Data ----------
function loadTransactions() {
  const raw = localStorage.getItem(STORAGE_KEY);
  transactions = raw ? JSON.parse(raw) : [];
}

function saveTransactions() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ---------- Form ----------
function setDefaultDate() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  document.getElementById('date').value = year + '-' + month + '-' + day;
}

function updateCategoryOptions() {
  const type = document.getElementById('type').value;
  const select = document.getElementById('category');
  select.innerHTML = '';
  CATEGORIES[type].forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = cat.name;
    select.appendChild(opt);
  });
}

function setupForm() {
  document.getElementById('type').addEventListener('change', updateCategoryOptions);

  document.getElementById('txForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const type = document.getElementById('type').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const category = document.getElementById('category').value;
    const date = document.getElementById('date').value;
    const note = document.getElementById('note').value.trim();

    if (!amount || amount <= 0) return;

    const tx = {
      id: generateId(),
      type,
      amount,
      category,
      date,
      note,
      createdAt: new Date().toISOString()
    };

    transactions.unshift(tx);
    saveTransactions();
    document.getElementById('txForm').reset();
    setDefaultDate();
    updateCategoryOptions();
    render();
  });
}

// ---------- Month Filter ----------
function setupMonthFilter() {
  const select = document.getElementById('monthFilter');
  const months = getAvailableMonths();

  select.innerHTML = '<option value="all">Semua Bulan</option>';
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.value;
    opt.textContent = m.label;
    select.appendChild(opt);
  });

  const now = new Date();
  const current = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  if (months.some(m => m.value === current)) {
    select.value = current;
  }

  select.addEventListener('change', render);
}

function getAvailableMonths() {
  const set = new Set();

  transactions.forEach(tx => {
    if (tx.date && tx.date.length >= 7) {
      set.add(tx.date.slice(0, 7));
    }
  });

  // Auto detect bulan semasa
  const now = new Date();
  const currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  set.add(currentMonth);

  return Array.from(set)
    .sort((a, b) => b.localeCompare(a))
    .map(v => {
      const parts = v.split('-');
      const year = parseInt(parts[0]);
      const month = parseInt(parts[1]) - 1;
      const date = new Date(year, month, 1);
      const label = date.toLocaleDateString('ms-MY', { month: 'long', year: 'numeric' });
      return { value: v, label: label };
    });
}

function getFilteredTransactions() {
  const month = document.getElementById('monthFilter').value;
  if (month === 'all') return transactions;
  return transactions.filter(tx => tx.date && tx.date.startsWith(month));
}

// ---------- Render ----------
function render() {
  const filtered = getFilteredTransactions();
  updateSummary(filtered);
  renderList(filtered);
  updateCharts();

  const currentVal = document.getElementById('monthFilter').value;
  setupMonthFilter();
  document.getElementById('monthFilter').value = currentVal;
}

function updateSummary(list) {
  let income = 0, expense = 0;
  list.forEach(tx => {
    if (tx.type === 'income') income += tx.amount;
    else expense += tx.amount;
  });
  const balance = income - expense;

  document.getElementById('balance').textContent = formatRM(balance);
  document.getElementById('totalIncome').textContent = formatRM(income);
  document.getElementById('totalExpense').textContent = formatRM(expense);

  const balEl = document.getElementById('balance');
  balEl.classList.toggle('text-red-500', balance < 0);
  balEl.classList.toggle('dark:text-red-400', balance < 0);
  balEl.classList.toggle('text-primary-600', balance >= 0);
  balEl.classList.toggle('dark:text-primary-500', balance >= 0);
}

function renderList(list) {
  const container = document.getElementById('txList');
  const empty = document.getElementById('emptyState');

  if (list.length === 0) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  container.innerHTML = list.map(tx => {
    const cat = findCategory(tx.type, tx.category);
    const isIncome = tx.type === 'income';
    return `
      <div class="tx-item flex items-center justify-between p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-700">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-medium" style="background:${cat.color}">
            ${cat.name.charAt(0)}
          </div>
          <div class="min-w-0">
            <p class="font-medium truncate">\( {cat.name} \){tx.note ? ' • ' + tx.note : ''}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">${formatDate(tx.date)}</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span class="font-semibold ${isIncome ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}">
            ${isIncome ? '+' : '-'} ${formatRM(tx.amount)}
          </span>
          <button onclick="deleteTx('${tx.id}')" class="text-gray-400 hover:text-red-500 transition p-1" title="Padam">
            🗑️
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function findCategory(type, id) {
  const list = CATEGORIES[type] || [];
  return list.find(c => c.id === id) || { name: id, color: '#6b7280' };
}

function deleteTx(id) {
  if (!confirm('Padam transaksi ini?')) return;
  transactions = transactions.filter(tx => tx.id !== id);
  saveTransactions();
  render();
}

function setupClearAll() {
  document.getElementById('clearAll').addEventListener('click', () => {
    if (!confirm('Padam SEMUA transaksi? Tindakan ini tidak boleh diundur.')) return;
    transactions = [];
    saveTransactions();
    render();
  });
}

// ---------- Charts ----------
function updateCharts() {
  const filtered = getFilteredTransactions();
  updatePieChart(filtered);
  updateBarChart();
}

function updatePieChart(list) {
  const expenses = list.filter(tx => tx.type === 'expense');
  const dataMap = {};
  expenses.forEach(tx => {
    const cat = findCategory('expense', tx.category);
    dataMap[cat.name] = (dataMap[cat.name] || 0) + tx.amount;
  });

  const labels = Object.keys(dataMap);
  const data = Object.values(dataMap);
  const colors = labels.map(name => {
    const cat = CATEGORIES.expense.find(c => c.name === name);
    return cat ? cat.color : '#6b7280';
  });

  const ctx = document.getElementById('pieChart').getContext('2d');
  const isDark = document.documentElement.classList.contains('dark');

  if (pieChart) pieChart.destroy();

  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels.length ? labels : ['Tiada data'],
      datasets: [{
        data: data.length ? data : [1],
        backgroundColor: data.length ? colors : ['#e5e7eb'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: isDark ? '#e5e7eb' : '#374151',
            padding: 12,
            font: { size: 12 }
          }
        }
      }
    }
  });
}

function updateBarChart() {
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const label = d.toLocaleDateString('ms-MY', { month: 'short' });
    months.push({ key, label });
  }

  const incomeData = [];
  const expenseData = [];

  months.forEach(m => {
    let inc = 0, exp = 0;
    transactions.forEach(tx => {
      if (tx.date && tx.date.startsWith(m.key)) {
        if (tx.type === 'income') inc += tx.amount;
        else exp += tx.amount;
      }
    });
    incomeData.push(inc);
    expenseData.push(exp);
  });

  const ctx = document.getElementById('barChart').getContext('2d');
  const isDark = document.documentElement.classList.contains('dark');

  if (barChart) barChart.destroy();

  barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: months.map(m => m.label),
      datasets: [
        {
          label: 'Pendapatan',
          data: incomeData,
          backgroundColor: '#22c55e',
          borderRadius: 6
        },
        {
          label: 'Perbelanjaan',
          data: expenseData,
          backgroundColor: '#ef4444',
          borderRadius: 6
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          ticks: { color: isDark ? '#9ca3af' : '#6b7280' },
          grid: { display: false }
        },
        y: {
          ticks: { color: isDark ? '#9ca3af' : '#6b7280' },
          grid: { color: isDark ? '#374151' : '#e5e7eb' }
        }
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: isDark ? '#e5e7eb' : '#374151',
            padding: 12
          }
        }
      }
    }
  });
}

// ---------- Helpers ----------
function formatRM(num) {
  return 'RM ' + num.toLocaleString('ms-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric' });
}

window.deleteTx = deleteTx;
</script>
</body>
</html>
